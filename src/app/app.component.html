<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="site-header">
  <nav class="primary-navigation" aria-label="Primary navigation">
    <div class="brand-group">
      <button
        *ngIf="showBackButton"
        class="icon-button back-button"
        type="button"
        aria-label="Return to the previous page"
        title="Go back"
        (click)="goBack()"
      >
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
      </button>

      <a
        class="brand-link"
        routerLink="/"
        aria-label="Open Science Chain home"
        (click)="closeNavigation()"
      >
        <img
          *ngIf="!logoError"
          src="assets/images/osc-logo-white-transparent.png"
          alt="Open Science Chain"
          (error)="onLogoError()"
        />
        <span *ngIf="logoError">Open Science Chain</span>
      </a>
    </div>

    <button
      class="icon-button navigation-toggle"
      type="button"
      aria-controls="primary-navigation-links"
      [attr.aria-expanded]="mobileNavigationOpen"
      [attr.aria-label]="
        mobileNavigationOpen ? 'Close navigation menu' : 'Open navigation menu'
      "
      [title]="
        mobileNavigationOpen ? 'Close navigation menu' : 'Open navigation menu'
      "
      (click)="toggleMobileNavigation()"
    >
      <i
        class="bi"
        [class.bi-x-lg]="mobileNavigationOpen"
        [class.bi-list]="!mobileNavigationOpen"
        aria-hidden="true"
      ></i>
    </button>

    <div
      id="primary-navigation-links"
      class="navigation-panel"
      [class.navigation-panel-open]="mobileNavigationOpen"
    >
      <div class="navigation-links">
        <a
          class="nav-link"
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeNavigation()"
          >Home</a
        >
        <a
          class="nav-link"
          routerLink="/list-artifacts"
          routerLinkActive="active"
          (click)="closeNavigation()"
          >Artifacts</a
        >
        <a
          class="nav-link"
          routerLink="/list-workflows"
          routerLinkActive="active"
          (click)="closeNavigation()"
          >Workflows</a
        >
        <a
          class="nav-link"
          routerLink="/"
          fragment="provenance"
          (click)="closeNavigation()"
          >How it works</a
        >
      </div>

      <div class="navigation-actions">
        <div class="contribute-dropdown">
          <button
            class="nav-action contribute-button"
            type="button"
            aria-haspopup="menu"
            [attr.aria-expanded]="contributeMenuOpen"
            (click)="toggleContributeMenu()"
          >
            Contribute
            <i
              class="bi bi-chevron-down"
              [class.rotated]="contributeMenuOpen"
              aria-hidden="true"
            ></i>
          </button>
          <div
            *ngIf="contributeMenuOpen"
            class="contribute-menu"
            role="menu"
            aria-label="Contribution type"
          >
            <button
              type="button"
              role="menuitem"
              (click)="onContributeClick('artifact')"
            >
              <i class="bi bi-box-seam" aria-hidden="true"></i>
              <span>
                <strong>Artifact</strong>
                <small>Register data, software, or a publication</small>
              </span>
            </button>
            <button
              type="button"
              role="menuitem"
              (click)="onContributeClick('workflow')"
            >
              <i class="bi bi-diagram-3" aria-hidden="true"></i>
              <span>
                <strong>Workflow</strong>
                <small>Document a reproducible process</small>
              </span>
            </button>
          </div>
        </div>

        <a
          *ngIf="!isAuthenticated"
          class="sign-in-button"
          routerLink="/auth/sign-in"
          routerLinkActive="active"
          (click)="closeNavigation()"
        >
          <i class="bi bi-person" aria-hidden="true"></i>
          Sign in
        </a>
        <button
          *ngIf="isAuthenticated"
          class="sign-in-button"
          type="button"
          (click)="logout()"
        >
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          Sign out
        </button>
      </div>
    </div>
  </nav>
</header>

<div *ngIf="mockPreview" class="mock-preview-banner" role="status">LOCAL MOCK PREVIEW - synthetic records; no Fabric connection</div>

<div id="main-content" tabindex="-1">
  <router-outlet></router-outlet>
</div>
