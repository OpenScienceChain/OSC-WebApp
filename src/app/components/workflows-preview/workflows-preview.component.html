<section class="catalog-preview" aria-labelledby="workflow-preview-heading">
  <div class="preview-heading">
    <h3 id="workflow-preview-heading">Workflows</h3>
    <a routerLink="/list-workflows">
      View all workflows
      <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </a>
  </div>

  <div *ngIf="isLoading" class="preview-state" role="status">
    Loading workflow preview...
  </div>

  <div *ngIf="hasError" class="preview-state preview-error" role="status">
    <span>The workflow preview is unavailable.</span>
    <button type="button" (click)="loadWorkflows()">Try again</button>
  </div>

  <div
    *ngIf="!isLoading && !hasError && workflows.length > 0"
    class="preview-grid"
  >
    <app-workflow-card
      *ngFor="let workflow of workflows"
      [workflow]="workflow"
    ></app-workflow-card>
  </div>

  <div
    *ngIf="!isLoading && !hasError && workflows.length === 0"
    class="preview-state"
  >
    No workflows have been documented yet.
  </div>
</section>
