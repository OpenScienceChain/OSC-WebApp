<article class="catalog-card">
  <header>
    <span class="record-type">Workflow</span>
    <h3>{{ workflow.title }}</h3>
  </header>
  <div class="card-body">
    <p class="description">{{ workflow.description }}</p>
    <dl>
      <div>
        <dt>Status</dt>
        <dd
          [class.status-failed]="workflow.submissionState === 'FAILED'"
          [class.status-pending]="workflow.submissionState === 'PENDING'"
        >
          {{ workflow.submissionState || 'Recorded' }}
        </dd>
      </div>
      <div>
        <dt>Last activity</dt>
        <dd>
          {{ workflow.updatedAt || workflow.submittedAt | date: 'mediumDate' }}
        </dd>
      </div>
    </dl>
    <div class="card-actions">
      <a [routerLink]="['/workflows', workflow.id]">
        View workflow
        <span class="visually-hidden">{{ workflow.title }}</span>
      </a>
      <a
        *ngIf="showManage"
        class="manage-action"
        [routerLink]="['/update-workflow', workflow.id]"
      >
        Manage Workflow
        <span class="visually-hidden">{{ workflow.title }}</span>
      </a>
    </div>
  </div>
</article>
