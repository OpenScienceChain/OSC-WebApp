<section class="catalog-preview" aria-labelledby="artifact-preview-heading">
  <div class="preview-heading">
    <h3 id="artifact-preview-heading">Artifacts</h3>
    <a routerLink="/list-artifacts">
      View all artifacts
      <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </a>
  </div>

  <div *ngIf="isLoading" class="preview-state" role="status">
    Loading artifact preview...
  </div>

  <div *ngIf="hasError" class="preview-state preview-error" role="status">
    <span>The artifact preview is unavailable.</span>
    <button type="button" (click)="loadArtifacts()">Try again</button>
  </div>

  <div
    *ngIf="!isLoading && !hasError && artifacts.length > 0"
    class="preview-grid"
  >
    <app-artifact-card
      *ngFor="let artifact of artifacts"
      [artifact]="artifact"
    ></app-artifact-card>
  </div>

  <div
    *ngIf="!isLoading && !hasError && artifacts.length === 0"
    class="preview-state"
  >
    No artifacts have been registered yet.
  </div>
</section>
