<main class="feedback-page">
  <div class="feedback-inner">
    <h1>Share feedback</h1>
    <p>
      Anonymous feedback helps us improve the demonstration. Answer any one or
      more questions. Analytics consent and sign-in are not required.
    </p>

    <form *ngIf="!submitted" (ngSubmit)="submit()">
      <label for="visual-rating">How would you rate the visual design?</label>
      <select id="visual-rating" name="visualRating" [(ngModel)]="visualRating">
        <option [ngValue]="null">No rating</option>
        <option *ngFor="let rating of [1, 2, 3, 4, 5]" [ngValue]="rating">
          {{ rating }} of 5
        </option>
      </select>

      <label for="automation-interest"
        >Would research workflow automation be useful to you?</label
      >
      <select
        id="automation-interest"
        name="automationInterest"
        [(ngModel)]="automationInterest"
      >
        <option value="">No answer</option>
        <option value="YES">Yes</option>
        <option value="MAYBE">Maybe</option>
        <option value="NO">No</option>
        <option value="UNSURE">Unsure</option>
      </select>

      <label for="overall-comment">What should we improve?</label>
      <textarea
        id="overall-comment"
        name="overallComment"
        [(ngModel)]="overallComment"
        maxlength="300"
        rows="5"
      ></textarea>
      <small>{{ overallComment.length }}/300 characters</small>

      <button type="submit" [disabled]="!valid || submitting">
        {{ submitting ? 'Sending feedback…' : 'Send feedback' }}
      </button>
      <p *ngIf="error" role="alert" class="feedback-error">{{ error }}</p>
    </form>
    <p *ngIf="submitted" role="status" class="feedback-success">
      Thank you for sharing your feedback.
    </p>
  </div>
</main>
